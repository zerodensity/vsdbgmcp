name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Builds both halves and checks that the package really contains the shim, the
      # icon and the licence, which is the part that fails silently.
      - name: Build
        shell: pwsh
        run: .\build.ps1 -Configuration Release

      - uses: actions/upload-artifact@v7
        with:
          name: vsdbgmcp-vsix
          path: src/VsDbgMcp.Host/bin/Release/*.vsix
          if-no-files-found: error
