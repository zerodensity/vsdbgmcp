name: release

# Tagging is what cuts a release. Pushing v0.1.0 builds the package and publishes
# it; nothing else does.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The tag is what people install from, so it has to agree with what the
      # package claims about itself. build.ps1 already refuses to build when the
      # manifest and Directory.Build.props disagree; this closes the loop on the
      # tag, before anything is published under the wrong number.
      - name: Check the tag against the manifest
        id: version
        shell: pwsh
        run: |
          $manifest = [xml](Get-Content src/VsDbgMcp.Host/source.extension.vsixmanifest)
          $version = $manifest.PackageManifest.Metadata.Identity.Version
          $tagged = '${{ github.ref_name }}'.TrimStart('v')

          if ($tagged -ne $version) {
            throw "tag ${{ github.ref_name }} does not match manifest version $version"
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      # Also verifies the package really contains the shim, both images and the
      # licence, which is the part that fails silently.
      - name: Build
        shell: pwsh
        run: .\build.ps1 -Configuration Release

      - name: Name the package after its version
        id: package
        shell: pwsh
        run: |
          $path = "artifacts/release/vsdbgmcp-${{ steps.version.outputs.version }}.vsix"
          New-Item -ItemType Directory -Force (Split-Path $path) | Out-Null
          Copy-Item src/VsDbgMcp.Host/bin/Release/VsDbgMcp.Host.vsix $path
          "path=$path" >> $env:GITHUB_OUTPUT

      - name: Take the notes from the changelog
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $sections = (Get-Content CHANGELOG.md -Raw) -split '(?m)^##\s+'
          $section = $sections |
              Where-Object { $_ -match "^$([regex]::Escape($version))\s" } |
              Select-Object -First 1

          if (-not $section) { throw "CHANGELOG.md has no entry for $version" }

          ($section -split "`n", 2)[1].Trim() | Set-Content release-notes.md -Encoding utf8

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' '${{ steps.package.outputs.path }}' `
            --title 'vsdbgmcp ${{ steps.version.outputs.version }}' `
            --notes-file release-notes.md

  # Uploads the package of the GitHub release, so the Marketplace gets exactly what
  # was released. Signs in by trusted publishing: the Marketplace publisher has a
  # policy for this repository, this workflow file and the production environment,
  # and no token is stored. An uploaded version cannot be replaced; when this job
  # fails, rerun it rather than retagging.
  marketplace:
    needs: release
    runs-on: windows-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Download the released package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download '${{ github.ref_name }}' --pattern '*.vsix' --dir artifacts/release

      # Older VsixPublishers have only -personalAccessToken. The runner's Visual
      # Studio SDK is tried first; Microsoft.VSSDK.BuildTools 18.12.465 is the first
      # package with -oidc, and is used when the runner's copy rejects it.
      - name: Find a VsixPublisher with -oidc
        id: publisher
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -prerelease -property installationPath
          $candidates = @(Join-Path $vs 'VSSDK\VisualStudioIntegration\Tools\Bin\VsixPublisher.exe')

          $version = '18.12.465'
          $url = "https://api.nuget.org/v3-flatcontainer/microsoft.vssdk.buildtools/$version/microsoft.vssdk.buildtools.$version.nupkg"
          try {
            Invoke-WebRequest $url -OutFile buildtools.zip
            Expand-Archive buildtools.zip -DestinationPath buildtools
            $candidates += (Resolve-Path buildtools/tools/vssdk/bin/VsixPublisher.exe).Path
          } catch {
            Write-Host "Microsoft.VSSDK.BuildTools $version is not available: $($_.Exception.Message)"
          }

          foreach ($exe in $candidates) {
            if (-not (Test-Path $exe)) { continue }
            $help = (& $exe publish -oidc 2>&1 | Out-String)
            Write-Host "$exe`n$(($help -split "`n")[0])"
            if ($help -notmatch "'-oidc' is an invalid argument") {
              "path=$exe" >> $env:GITHUB_OUTPUT
              exit 0
            }
          }
          throw 'No VsixPublisher with -oidc found.'

      - name: Publish to the Marketplace
        shell: pwsh
        run: |
          $package = Get-ChildItem artifacts/release -Filter *.vsix | Select-Object -First 1
          & '${{ steps.publisher.outputs.path }}' publish `
            -payload $package.FullName `
            -publishManifest marketplace/publishManifest.json `
            -oidc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
