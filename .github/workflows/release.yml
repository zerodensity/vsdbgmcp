name: release

# Tagging is what cuts a release. Pushing v0.1.0 builds the package and publishes
# it; nothing else does.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The tag is what people install from, so it has to agree with what the
      # package claims about itself. build.ps1 already refuses to build when the
      # manifest and Directory.Build.props disagree; this closes the loop on the
      # tag, before anything is published under the wrong number.
      - name: Check the tag against the manifest
        id: version
        shell: pwsh
        run: |
          $manifest = [xml](Get-Content src/VsDbgMcp.Host/source.extension.vsixmanifest)
          $version = $manifest.PackageManifest.Metadata.Identity.Version
          $tagged = '${{ github.ref_name }}'.TrimStart('v')

          if ($tagged -ne $version) {
            throw "tag ${{ github.ref_name }} does not match manifest version $version"
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      # Also verifies the package really contains the shim, both images and the
      # licence, which is the part that fails silently.
      - name: Build
        shell: pwsh
        run: .\build.ps1 -Configuration Release

      - name: Name the package after its version
        id: package
        shell: pwsh
        run: |
          $path = "artifacts/release/vsdbgmcp-${{ steps.version.outputs.version }}.vsix"
          New-Item -ItemType Directory -Force (Split-Path $path) | Out-Null
          Copy-Item src/VsDbgMcp.Host/bin/Release/VsDbgMcp.Host.vsix $path
          "path=$path" >> $env:GITHUB_OUTPUT

      - name: Take the notes from the changelog
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $sections = (Get-Content CHANGELOG.md -Raw) -split '(?m)^##\s+'
          $section = $sections |
              Where-Object { $_ -match "^$([regex]::Escape($version))\s" } |
              Select-Object -First 1

          if (-not $section) { throw "CHANGELOG.md has no entry for $version" }

          ($section -split "`n", 2)[1].Trim() | Set-Content release-notes.md -Encoding utf8

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' '${{ steps.package.outputs.path }}' `
            --title 'vsdbgmcp ${{ steps.version.outputs.version }}' `
            --notes-file release-notes.md

  # Uploads the package of the GitHub release, so the Marketplace gets exactly what
  # was released. Signs in by trusted publishing: the Marketplace publisher has a
  # policy for this repository, this workflow file and the production environment,
  # and no token is stored. An uploaded version cannot be replaced; when this job
  # fails, rerun it rather than retagging.
  marketplace:
    needs: release
    runs-on: windows-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Download the released package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download '${{ github.ref_name }}' --pattern '*.vsix' --dir artifacts/release

      # Every published VsixPublisher builds its -oidc token exchange without an
      # api-version, and the Marketplace rejects it (microsoft/vsmarketplace#2310).
      # Until a fixed one ships, this job exchanges the GitHub OIDC token itself, as
      # the Marketplace's own vsce does, and hands VsixPublisher the short-lived
      # credential. It is still trusted publishing: nothing is stored.
      - name: Exchange the GitHub token for a Marketplace credential
        id: credential
        shell: pwsh
        run: |
          $publisher = (Get-Content marketplace/publishManifest.json -Raw | ConvertFrom-Json).publisher
          $oidc = Invoke-RestMethod -Method Get `
            -Uri "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=marketplace.visualstudio.com" `
            -Headers @{ Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"; Accept = 'application/json' }
          $exchange = Invoke-RestMethod -Method Post `
            -Uri 'https://marketplace.visualstudio.com/_apis/gallery/token?api-version=7.2-preview.1' `
            -Headers @{ Authorization = "FederatedToken $($oidc.value)"; Accept = 'application/json'; 'X-Market-CI-Provider' = 'github-actions' } `
            -ContentType 'application/json' `
            -Body (@{ publisherName = $publisher } | ConvertTo-Json)
          if (-not $exchange.credential) { throw 'The Marketplace returned no credential.' }
          "::add-mask::$($exchange.credential)"
          "credential=$($exchange.credential)" >> $env:GITHUB_OUTPUT

      - name: Publish to the Marketplace
        shell: pwsh
        env:
          MARKETPLACE_CREDENTIAL: ${{ steps.credential.outputs.credential }}
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -prerelease -property installationPath
          $publisher = Join-Path $vs 'VSSDK\VisualStudioIntegration\Tools\Bin\VsixPublisher.exe'
          $package = Get-ChildItem artifacts/release -Filter *.vsix | Select-Object -First 1
          & $publisher publish `
            -payload $package.FullName `
            -publishManifest marketplace/publishManifest.json `
            -personalAccessToken $env:MARKETPLACE_CREDENTIAL
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
